services:
  paseo:
    image: ${PI_BOX_PASEO_IMAGE:-morchv/pi-box-paseo:latest}
    container_name: pi-box-paseo
    restart: unless-stopped
    ports:
      - "6767:6767"
    env_file:
      - path: ${PI_BOX_ROOT:-${HOME}/.pi-box}/paseo.env
        required: false
      - path: ${PI_BOX_ROOT:-${HOME}/.pi-box}/pi-box.env
        required: false
    volumes:
      - "${PI_BOX_HOME:-${PI_BOX_ROOT:-${HOME}/.pi-box}/home}:/home/paseo"
      - "${WORKSPACE:-${PI_BOX_HOME:-${PI_BOX_ROOT:-${HOME}/.pi-box}/home}}:/workspace"